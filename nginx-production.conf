# NGINX Reverse Proxy Configuration - PRODUCTION
# Configuración para HTTPS detection correcta con Security\Cookies

server {
    listen 443 ssl http2;
    server_name bubble-talents.com;

    # SSL Configuration
    ssl_certificate     /path/to/certificate.crt;
    ssl_certificate_key /path/to/private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # Proxy to backend
    location /api/ {
        proxy_pass http://backend-server:80;
        
        # 🔒 CRITICAL: Headers for HTTPS detection
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP          $remote_addr;
        
        # Cookie security
        proxy_set_header Host $host;
        proxy_cookie_flags ~ secure httponly samesite=strict;
        
        # CORS support
        proxy_set_header Origin $http_origin;
        proxy_set_header Access-Control-Request-Method $http_access_control_request_method;
        proxy_set_header Access-Control-Request-Headers $http_access_control_request_headers;
    }

    # Frontend static files
    location / {
        root /var/www/bubble-talents/frontend/dist;
        try_files $uri $uri/ /index.html;
        
        # Security headers para frontend
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https:; font-src 'self'" always;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name bubble-talents.com;
    return 301 https://$server_name$request_uri;
}
