# Configuración Nginx SEGURA para Bubble of Talents API
# Archivo: /etc/nginx/sites-available/bubble-talents-secure

server {
    listen 80;
    listen [::]:80;
    server_name api.bubble-talents.com;  # Cambiar por tu dominio
    
    # Directorio raíz apunta a la carpeta public
    root /var/www/bubble-talents/backend/public;
    index index.php index.html index.htm;

    # Logs
    access_log /var/log/nginx/bubble-talents-access.log;
    error_log /var/log/nginx/bubble-talents-error.log;

    # ================================================================
    # HEADERS DE SEGURIDAD CRÍTICOS
    # ================================================================
    
    # Content Security Policy con hashes reales
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-CfkGcYvgRfJXXrvUV8JFUkQE5vGynt3abJcJyZB8KlE=' 'sha256-ehlwsI9K5iK41aNU+f2D8GmxNF3LvO9j2dLd+TjwpvQ=' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' https: data: blob:; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://api.bubble-talents.com wss: ws:; media-src 'self' data: blob:; object-src 'none'; frame-src 'none'; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests; block-all-mixed-content" always;
    
    # Prevenir clickjacking
    add_header X-Frame-Options "DENY" always;
    
    # Prevenir MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Controlar información del referrer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Permissions Policy - restringir APIs peligrosas
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
    
    # XSS Protection (legacy pero útil)
    add_header X-XSS-Protection "1; mode=block" always;
    
    # HSTS - Solo habilitar si tienes HTTPS configurado
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ================================================================
    # CONFIGURACIÓN CORS (Ya existente)
    # ================================================================
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Accept, Origin' always;
    add_header 'Access-Control-Max-Age' 3600 always;

    # Manejar solicitudes OPTIONS (preflight CORS)
    if ($request_method = 'OPTIONS') {
        return 200;
    }

    # ================================================================
    # CONFIGURACIÓN DE RUTAS
    # ================================================================
    
    # Servir archivos estáticos directamente si existen
    location / {
        try_files $uri $uri/ @api;
    }

    # Redirigir rutas API al router PHP
    location @api {
        rewrite ^.*$ /router.php last;
    }

    # Configuración específica para archivos PHP
    location ~ \.php$ {
        # Verificar que el archivo existe, sino redirigir al router
        try_files $uri @api;
        
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;  # Ajustar según tu versión PHP
        fastcgi_index index.php;
        
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        
        # Para el router, necesita acceso al path completo
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        include fastcgi_params;
    }

    # Configuración especial para router.php (un nivel arriba)
    location = /router.php {
        internal;
        root /var/www/bubble-talents/backend;
        
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/router.php;
        fastcgi_param SCRIPT_NAME /router.php;
        fastcgi_param REQUEST_URI $request_uri;
        
        include fastcgi_params;
    }

    # ================================================================
    # CACHE PARA ARCHIVOS ESTÁTICOS CON SEGURIDAD
    # ================================================================
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|ico)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        
        # Aplicar headers de seguridad también a assets
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ================================================================
    # SEGURIDAD - DENEGAR ACCESOS PELIGROSOS
    # ================================================================
    
    # Denegar acceso a archivos sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~* \.(log|ini|conf|sql|bak|backup)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Denegar acceso a directorios sensibles
    location ^~ /config/ {
        deny all;
    }
    
    location ^~ /vendor/ {
        deny all;
    }

    # ================================================================
    # LIMITACIONES DE SEGURIDAD
    # ================================================================
    
    # Limitar tamaño de subida
    client_max_body_size 20M;
    
    # Limitar buffer sizes para prevenir ataques
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    
    # Timeouts de seguridad
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
}

