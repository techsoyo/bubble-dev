# Configuración Nginx para Bubble of Talents API
# Archivo: /etc/nginx/sites-available/bubble-talents

server {
    listen 80;
    listen [::]:80;
    server_name api.bubble-talents.com;  # Cambiar por tu dominio
    
    # Directorio raíz apunta a la carpeta public
    root /var/www/bubble-talents/backend/public;
    index index.php index.html index.htm;

    # Logs
    access_log /var/log/nginx/bubble-talents-access.log;
    error_log /var/log/nginx/bubble-talents-error.log;

    # Configuración CORS
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Accept, Origin' always;
    add_header 'Access-Control-Max-Age' 3600 always;

    # Manejar solicitudes OPTIONS (preflight CORS)
    if ($request_method = 'OPTIONS') {
        return 200;
    }

    # Servir archivos estáticos directamente si existen
    location / {
        try_files $uri $uri/ @api;
    }

    # Redirigir rutas API al router PHP
    location @api {
        rewrite ^.*$ /router.php last;
    }

    # Configuración específica para archivos PHP
    location ~ \.php$ {
        # Verificar que el archivo existe, sino redirigir al router
        try_files $uri @api;
        
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;  # Ajustar según tu versión PHP
        fastcgi_index index.php;
        
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        
        # Para el router, necesita acceso al path completo
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        include fastcgi_params;
    }

    # Configuración especial para router.php (un nivel arriba)
    location = /router.php {
        internal;
        root /var/www/bubble-talents/backend;
        
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/router.php;
        fastcgi_param SCRIPT_NAME /router.php;
        fastcgi_param REQUEST_URI $request_uri;
        
        include fastcgi_params;
    }

    # Cache para archivos estáticos
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|ico)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Seguridad - denegar acceso a archivos sensibles
    location ~ /\. {
        deny all;
    }
    
    location ~* \.(log|ini|conf)$ {
        deny all;
    }

    # Limitar tamaño de subida
    client_max_body_size 20M;
}

