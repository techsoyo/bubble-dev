<!DOCTYPE html>
<html>

<head>
  <title>Test Dashboard Applications</title>
</head>

<body>
  <h1>Test de Aplicaciones del Dashboard</h1>
  <div id="results"></div>

  <script>
    // Simular el login para obtener el email
    const userEmail = 'raul.campos@example.com';

    async function testApplications() {
      const results = document.getElementById('results');
      results.innerHTML = '<p>Iniciando pruebas...</p>';

      try {
        // 1. Probar obtener candidatos
        console.log('1. Probando getCandidates...');
        const candidatesResponse = await fetch('http://localhost:8000/api/endpoints/candidates.php');
        const candidatesData = await candidatesResponse.json();
        console.log('Candidates response:', candidatesData);

        if (candidatesData.success && candidatesData.data) {
          const candidato = candidatesData.data.find(c => c.email === userEmail);
          console.log('Candidato encontrado:', candidato);

          if (candidato) {
            results.innerHTML += `<p>✅ Candidato encontrado: ${candidato.first_name} ${candidato.last_name} (ID: ${candidato.id})</p>`;

            // 2. Probar obtener aplicaciones
            console.log('2. Probando getCandidateApplications...');
            const applicationsResponse = await fetch(`http://localhost:8000/api/endpoints/candidate-applications.php?candidate_id=${candidato.id}`);
            const applicationsData = await applicationsResponse.json();
            console.log('Applications response:', applicationsData);

            if (applicationsData.success) {
              results.innerHTML += `<p>✅ Aplicaciones obtenidas: ${applicationsData.count} aplicaciones</p>`;

              applicationsData.data.forEach((app, index) => {
                results.innerHTML += `
                                    <div style="border: 1px solid #ccc; margin: 10px; padding: 10px;">
                                        <h3>Aplicación ${index + 1}</h3>
                                        <p><strong>Título:</strong> ${app.job_title}</p>
                                        <p><strong>Estado:</strong> ${app.status}</p>
                                        <p><strong>Fecha:</strong> ${app.applied_date}</p>
                                        <p><strong>Ubicación:</strong> ${app.job_location}</p>
                                        <p><strong>Salario:</strong> ${app.salary_range}</p>
                                    </div>
                                `;
              });
            } else {
              results.innerHTML += `<p>❌ Error obteniendo aplicaciones: ${applicationsData.message}</p>`;
            }
          } else {
            results.innerHTML += `<p>❌ No se encontró candidato con email: ${userEmail}</p>`;
          }
        } else {
          results.innerHTML += `<p>❌ Error obteniendo candidatos: ${candidatesData.message}</p>`;
        }

      } catch (error) {
        console.error('Error en test:', error);
        results.innerHTML += `<p>❌ Error: ${error.message}</p>`;
      }
    }

    // Ejecutar test al cargar la página
    testApplications();
  </script>
</body>

</html>
