<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test AI Translation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    button {
      background: #FF4785;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #e63673;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #f9f9f9;
    }

    .error {
      background: #ffeaea;
      border-color: #ff6b6b;
      color: #d63031;
    }

    .success {
      background: #eafaea;
      border-color: #6bcf7f;
      color: #2d3436;
    }
  </style>
</head>

<body>
  <h1>🤖 Test AI Translation</h1>
  <p>Prueba el endpoint de traducción con IA</p>

  <form id="translationForm">
    <div class="form-group">
      <label for="textInput">Texto a traducir (español):</label>
      <textarea id="textInput" placeholder="Ejemplo: Desarrollador Frontend con experiencia en React..."></textarea>
    </div>

    <div class="form-group">
      <label for="contextSelect">Contexto:</label>
      <select id="contextSelect">
        <option value="job_posting">Oferta de trabajo</option>
        <option value="general">General</option>
      </select>
    </div>

    <button type="submit" id="translateBtn">Traducir a Inglés</button>
  </form>

  <div id="result" class="result" style="display: none;">
    <h3>Resultado:</h3>
    <div id="resultContent"></div>
  </div>

  <script>
    const form = document.getElementById('translationForm');
    const textInput = document.getElementById('textInput');
    const contextSelect = document.getElementById('contextSelect');
    const translateBtn = document.getElementById('translateBtn');
    const result = document.getElementById('result');
    const resultContent = document.getElementById('resultContent');

    // Ejemplos de texto para pruebas rápidas
    const examples = [
      'Desarrollador Frontend con experiencia en React y TypeScript',
      'Tiempo completo',
      'Desarrollo Web',
      'Buscamos un profesional apasionado por la tecnología',
      'Trabajo en equipo y comunicación efectiva'
    ];

    // Agregar ejemplos como botones
    const examplesDiv = document.createElement('div');
    examplesDiv.innerHTML = '<p><strong>Ejemplos rápidos:</strong></p>';
    examples.forEach(example => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = example;
      btn.style.margin = '5px';
      btn.style.fontSize = '12px';
      btn.style.padding = '5px 10px';
      btn.onclick = () => textInput.value = example;
      examplesDiv.appendChild(btn);
    });
    form.appendChild(examplesDiv);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const text = textInput.value.trim();
      if (!text) {
        alert('Por favor ingresa un texto para traducir');
        return;
      }

      translateBtn.disabled = true;
      translateBtn.textContent = 'Traduciendo...';
      result.style.display = 'none';

      try {
        const response = await fetch('/api/ai/translate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            text: text,
            targetLanguage: 'en',
            context: contextSelect.value
          })
        });

        const data = await response.json();

        if (data.success) {
          result.className = 'result success';
          resultContent.innerHTML = `
                        <p><strong>Original:</strong> ${data.original}</p>
                        <p><strong>Traducción:</strong> ${data.translation}</p>
                        <p><strong>Idioma objetivo:</strong> ${data.targetLanguage}</p>
                    `;
        } else {
          result.className = 'result error';
          resultContent.innerHTML = `
                        <p><strong>Error:</strong> ${data.error}</p>
                        <p><strong>Texto original:</strong> ${data.original || text}</p>
                    `;
        }

        result.style.display = 'block';

      } catch (error) {
        result.className = 'result error';
        resultContent.innerHTML = `
                    <p><strong>Error de conexión:</strong> ${error.message}</p>
                    <p>Verifica que el servidor backend esté funcionando.</p>
                `;
        result.style.display = 'block';
      }

      translateBtn.disabled = false;
      translateBtn.textContent = 'Traducir a Inglés';
    });

    // Establecer un ejemplo por defecto
    textInput.value = examples[0];
  </script>
</body>

</html>
